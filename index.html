<html lang="zh-Hant">
<html>
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製作七夕粿！</title>
    <style>
        body {
            /* 1. 設定背景圖片路徑 */
            background-image: url('webA工作區域 1'); 
            
            background-size: 100% auto;
           
            
            /* 3. 讓背景固定不隨捲軸移動 */
            background-attachment: scroll;
            
            /* 4. 置中對齊 */
            background-position: center top;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-color: #b22020;

        /* 設定標題顏色與大小 */
        h1 {
            text-align: Center; /* 讓內容居中 */
            color: #3a2301;
            font-size: 50px; /* 標題字體大小 */
        }

        /* 設定段落文字大小 */
        p {
            text-align: Left; /* 讓內容居中 */
            font-size: 25px;
            line-height: 1.6;
            color: #3a2301; /* 文字顏色 */
        }

        /* 設定圖片樣式 */
        img {
            border-radius: 15px; /* 讓圖片圓角 */
            margin-top: 20px;
        }
        /* 田字型容器 */
        /* 田字型容器 */
      .grid-container {
          display: grid;
          /* 建立兩欄，每欄寬度平分 (1fr) */
          grid-template-columns: 1fr 1fr;
          /* 建立兩列 */
          grid-template-rows: 300px 300px; 
          /* 格子間的距離 */
          gap: 10px;
          padding: 10px;
          max-width: 100%px;
          box-sizing: border-box;
      }

      /* 每個格子的樣式 */
      .grid-item {
          background-color: rgba(255, 255, 255, 0.2); /* 半透明背景 */
          border: 1px solid #e99e9d;
          border-radius: 12px;
          padding: 10px;
          text-align: center;
          color: white;
      }
      .grid-item img {
          width: 100%;       /* 圖片寬度填滿格子 */
          height: 120px;     /* 固定高度，讓四個格子看起來一樣齊 */
          object-fit: cover; /* 關鍵！避免圖片因為固定高度而被壓扁 */
          border-radius: 8px;
      }

      .grid-item p {
          font-size: 14px;   /* 手機版文字縮小一點，避免折行太亂 */
          margin-top: 8px;
          color: #ffffff;
      }

    
    </style>
</head>
<body>
<div class="content">
    <h1>製作七夕粿！</h1>  
<div class="grid-container">
    <div class="grid-item">
        <h3>第一關-福氣到！</h3>
        <p>請前往找找畫面中一共有幾個『福』字？</p>
        <p>請輸入數量：</p>
        <input type="number" id="quizInput" placeholder="輸入數字" style="width: 150px; height: 40px; text-align: center;"
        style="display: flex; flex-direction: column; align-items: center; gap: 15px;"><br>
    
    
          <!-- 檢查按鈕 -->
          <button onclick="checkAnswer()" 
              style="margin-top: 15px;background-color: #e99e9d; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-left: 10px; font-weight: bold;">
              送出答案
          </button>
    
          <!-- 用來顯示結果的文字 -->
          <p id="resultMsg" style="margin-top: 15px; font-weight: bold; min-height: 24px;"></p>
      </div>

      <script>
      function checkAnswer() {
          const userAnswer = document.getElementById('quizInput').value;
          const resultMsg = document.getElementById('resultMsg');
    
          // 設定你的正確答案（例如答案是 3）
          const correctAnswer = "3"; 

          if (userAnswer === "") {
              resultMsg.innerText = "請先輸入數字喔！";
              resultMsg.style.color = "yellow";
          } else if (userAnswer === correctAnswer) {
              resultMsg.innerText = "🎉 太棒了！答案正確！";
              resultMsg.style.color = "#90ee90"; // 淺綠色
          } else {
              resultMsg.innerText = "❌ 答錯了，再數一次圖片喔！";
              resultMsg.style.color = "#ffcccb"; // 淺紅色
          }
      }
      </script>
   </div>
   <div class="grid-item">
        <h3>步驟 2</h3>
        <p>搓圓壓洞</p>
        
    </div>
    <div class="grid-item">
        <h3>步驟 3</h3>
        <p>下鍋水煮</p>
       
    </div>
    <div class="grid-item">
        <h3>步驟 4</h3>
        <p>淋上糖水</p>
        <!-- 可以放更多圖片或文字 -->
    </div>
</div>

   <div class="content">
    <h1>製作七夕粿！</h1>
    
    <p>
1.準備粉團：糯米粉加水揉成團，搓圓後用手指壓出中心凹洞。<br>
   
    </p>
    <p>
2.水煮：將粉團放入滾水中煮至浮起。<br>  
    </p>
    <p>
3.製作糖水：糖（白糖、黑糖皆可）加水煮成糖水。<br>
    </p>
    <p>
4.組合：將煮好的糖粿放入碗中，淋上糖水即可，也可加花生碎。<br>
    </p>

</body>
</html>
