<script>
    // 追蹤關卡進度
let gameProgress = {
    q1: false,
    q2: false,
    q3: false,
    q4: false
};

// 檢查是否所有關卡都達成，若達成則解鎖兌換按鈕
function checkAllLevelsCleared() {
    const isAllCleared = Object.values(gameProgress).every(status => status === true);
    const redeemBtn = document.getElementById('redeemBtn');
    
    // 只有在還沒兌換過的前提下，才根據進度啟用按鈕
    const phone = localStorage.getItem('currentPhone');
    const isRedeemed = localStorage.getItem('redeemed_' + phone) === 'true';

    if (isAllCleared && !isRedeemed) {
        redeemBtn.disabled = false;
        redeemBtn.style.backgroundColor = "#e99e9d"; // 恢復亮色
        redeemBtn.innerText = "兌換";
    } else if (!isRedeemed) {
        redeemBtn.disabled = true;
        redeemBtn.style.backgroundColor = "#ccc";
        redeemBtn.innerText = "完成任務後解鎖";
    }
}
/* --- 後台即時連動與提交邏輯 (核心校正) --- */
// 1. 已修正為完整的 formResponse 提交網址
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdpnvMA2aDoBGPkT4kXU1CR_EPJ0lvsY0m3VOwVsmEa2wOaMw/formResponse";
    const PHONE_ENTRY = "entry.1545230275"; 
    // 您部署的查詢 API
    const CHECK_API_URL = "https://script.google.com/macros/s/AKfycbxkF94-7CGRp-7-Xp3STilyvonfx2ftzv_7LXnkFvlRzcz-PUNEwUF3u91BqrODcg4x/exec"; 

   async function initUser() {
    const phoneInput = document.getElementById('userPhoneInput');
    const phone = phoneInput.value;
    const btn = document.querySelector("#phoneModal .btn-check");
    
    if (!/^09\d{8}$/.test(phone)) return alert("請輸入正確的手機號格式");

    btn.innerText = "查詢中...";
    btn.disabled = true;

    // 設定 5 秒超時，防止 API 沒反應導致按鈕卡死
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    try {
        const response = await fetch(`${CHECK_API_URL}?phone=${phone}`, { signal: controller.signal });
        const result = await response.json();

        if (result.exists) {
            alert("此手機號已兌換完畢！");
            localStorage.setItem('redeemed_' + phone, 'true');
        }
        
        localStorage.setItem('currentPhone', phone);
        document.getElementById('phoneModal').style.display = 'none';
        checkAndRefreshStatus(phone);

    } catch (e) {
        // 如果 API 報錯或超時，直接讓使用者進入
        console.warn("後台查詢失敗，切換至本地模式", e);
        localStorage.setItem('currentPhone', phone);
        document.getElementById('phoneModal').style.display = 'none';
        checkAndRefreshStatus(phone);
    } finally {
        clearTimeout(timeoutId);
        btn.innerText = "確認送出";
        btn.disabled = false;
    }
}

function checkAndRefreshStatus(phone) {
    const btn = document.getElementById('redeemBtn');
    const isRedeemed = localStorage.getItem('redeemed_' + phone);
    if (isRedeemed === 'true') {
        btn.innerText = "已兌換完畢";
        btn.disabled = true;
        btn.style.backgroundColor = "#888";
    } else {
        btn.innerText = "兌換";
        btn.disabled = false;
        btn.style.backgroundColor = "#e99e9d";
    }
}

// 1. 點擊底部「兌換」按鈕時觸發
function handleRedeem() {
    const phone = localStorage.getItem('currentPhone');
    if (!phone) return alert("請先輸入手機號碼");
    
    // 顯示自定義的二次確認彈窗
    document.getElementById('confirmModal').style.display = 'flex';
}

// 2. 關閉彈窗
function closeConfirm() {
    document.getElementById('confirmModal').style.display = 'none';
}

// 3. 真正執行兌換 (由彈窗內的「工作人員確認」按鈕觸發)
function executeRedeem() {
    const phone = localStorage.getItem('currentPhone');
    
    // 執行兌換流程
    localStorage.setItem('redeemed_' + phone, 'true');
    checkAndRefreshStatus(phone);
    
    // 關閉彈窗並提示完成
    closeConfirm();
    alert('兌換完成');

    // 提交到 [Google Forms formResponse](https://support.google.com)
    const params = new URLSearchParams();
    params.append(PHONE_ENTRY, phone);
    
    fetch(FORM_URL, { 
        method: "POST", 
        mode: "no-cors", 
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString() 
    }).catch(e => console.log("提交中..."));
}



// 頁面刷新初始化
window.onload = () => {
    document.getElementById('phoneModal').style.display = 'flex';
    const lastPhone = localStorage.getItem('currentPhone');
    if (lastPhone) {
        document.getElementById('userPhoneInput').value = lastPhone;
    }
};

/* --- 遊戲關卡邏輯 --- */
function checkAnswer() {
    if (document.getElementById('quizInput').value === "13") {
        document.getElementById('success-content').style.display = "block";
    } else {
        document.getElementById('resultMsg').innerText = "❌ 再數一次喔！";
    }
}

function checkAnswer2(isCorrect) {
    if (isCorrect) {
        // 答對了，顯示成功圖片
        document.getElementById('success-content2').style.display = "block";
        document.getElementById('resultMsg2').innerText = ""; 
    } else {
        // 答錯了，顯示提示文字
        const msg = document.getElementById('resultMsg2');
        msg.innerText = "❌ 再猜猜看！";
        msg.style.color = "#8b0000";
        msg.style.fontWeight = "bold";
    }
}
function checkAnswer3() {
    const val = parseInt(document.getElementById('quizInput3').value);
    const displayArea = document.getElementById('success-content3');
    const quizDiv = document.getElementById('quiz3-content');
    const imgTag = document.getElementById('resultImg3');

    if (isNaN(val) || val < 1 || val > 12) {
        alert("請輸入 1 到 12 之間的數字");
        return;
    }

    let finalSrc = "";
    // 產生隨機布林值，用於二選一
    const isOptionA = Math.random() < 0.5;

    if (val >= 1 && val <= 7) {
        // 1-7：隨機二選一 (w1 或 w11)
        finalSrc = isOptionA ? "w1工作區域 1.png" : "w11工作區域 1.png";
    } else if (val === 8 || val === 9) {
        // 8 或 9：隨機選 w2 或 w22
        finalSrc = isOptionA ? "w2工作區域 1.png" : "w22工作區域 1.png";
    } else if (val === 10 || val === 11) {
        // 10 或 11：隨機選 w3 或 w33
        finalSrc = isOptionA ? "w3工作區域 1.png" : "w33工作區域 1.png";
    } else {
        // 12 (或其他)：固定顯示 w4
        finalSrc = "w4工作區域 1.png";
    }

    // 更新圖片並切換顯示狀態
    imgTag.src = finalSrc;
    displayArea.style.display = "block"; // 顯示結果圖片
}

/* --- 第四關：相機與拍照合成邏輯 --- */
async function startCamera() {
    const video = document.getElementById('videoStream');
    const overlay = document.getElementById('camera-overlay');
    const quizContent = document.getElementById('quiz4-content');
    
    try {
        // 調用 [MediaDevices.getUserMedia](https://developer.mozilla.org)
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } 
        });
        video.srcObject = stream;
        video.style.display = "block";
        overlay.style.display = "block";
        
        // 變更提示文字
        quizContent.style.background = "rgba(255,255,255,0.6)";
        quizContent.innerHTML = "<p style='margin:0; font-weight:bold; color:#b22020;'>📷 點擊畫面拍照</p>";
        
        // 綁定點擊影片拍照事件
        video.onclick = () => takePicture(stream);
    } catch (err) {
        alert("無法啟動相機。請檢查是否使用 HTTPS 安全連線，並已允許權限。");
    }
}

function takePicture(stream) {
    const video = document.getElementById('videoStream');
    const overlay = document.getElementById('camera-overlay');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo-preview');
    const quizContent = document.getElementById('quiz4-content');

    // 精確對齊畫布與影片像素
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');

    // 1. 繪製攝影畫面 2. 疊加相框 (webC工作區域 1.png)
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

    // 3. 轉為 Data URL 並顯示成品
    photo.src = canvas.toDataURL('image/png');
    photo.style.display = "block";
    
    // 4. 關閉串流並隱藏元件
    video.style.display = "none";
    overlay.style.display = "none";
    quizContent.style.display = "none";
    stream.getTracks().forEach(track => track.stop());
}

/* --- 可拖動懸浮按鈕邏輯 --- */
const dragBtn = document.getElementById("floatingBtn");
const imgOverlay = document.getElementById("imageOverlay");
let isDragging = false;
let startX, startY, moveX = 0, moveY = 0;
let startTime;

dragBtn.addEventListener("touchstart", (e) => {
    isDragging = false;
    startTime = Date.now();
    // 扣除已移動的距離，確保連續拖動不跳位
    startX = e.touches[0].clientX - moveX;
    startY = e.touches[0].clientY - moveY;
}, {passive: false});

dragBtn.addEventListener("touchmove", (e) => {
    isDragging = true;
    e.preventDefault();
    moveX = e.touches[0].clientX - startX;
    moveY = e.touches[0].clientY - startY;
    dragBtn.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
}, {passive: false});

dragBtn.addEventListener("touchend", (e) => {
    const duration = Date.now() - startTime;
    // 判斷：如果沒移動過或點擊時間極短，則執行「打開說明圖片」
    if (!isDragging || duration < 150) {
        imgOverlay.style.display = "flex";
    }
});

function closeImageOverlay() {
    imgOverlay.style.display = "none";
}

    /* --- 配置回饋表單後台 --- */
const FEEDBACK_FORM_URL = "https://docs.google.com";
const FEEDBACK_ENTRY = "entry.999999999"; // 回饋內容的 ID

// 1. 修改按鈕狀態刷新邏輯
function checkAndRefreshStatus(phone) {
    const btn = document.getElementById('redeemBtn');
    const isRedeemed = localStorage.getItem('redeemed_' + phone);
    
    if (isRedeemed === 'true') {
        // 兌換完成後，按鈕轉化為開啟內嵌表單
        btn.innerText = "回饋表單";
        btn.disabled = false;
        btn.style.backgroundColor = "#3a2301"; 
        btn.onclick = () => {
            document.getElementById('feedbackPage').style.display = 'block';
        };
    } else {
        btn.innerText = "兌換";
        btn.disabled = false;
        btn.style.backgroundColor = "#e99e9d";
        btn.onclick = handleRedeem;
    }
}


// 2. 處理回饋表單提交至 Google [formResponse](https://support.google.com)
async function submitFeedback() {
    const content = document.getElementById('feedbackContent').value;
    const phone = localStorage.getItem('currentPhone');

    if (!content) return alert("請輸入回饋內容");

    const params = new URLSearchParams();
    params.append(FEEDBACK_ENTRY, content);
    params.append(PHONE_ENTRY, phone); // 同時記錄是誰回饋的

    try {
        fetch(FEEDBACK_FORM_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        });
        
        alert("感謝您的回饋！");
        document.getElementById('feedbackPage').style.display = 'none';
    } catch (e) {
        alert("傳送失敗，請檢查網路連接");
    }
}
