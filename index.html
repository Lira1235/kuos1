<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製作七夕粿！</title>
    <style>
        body {
            background-image: url('未命名設計.gif'); 
            background-size: 100% auto;
            background-attachment: scroll;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-color: #b22020;
            margin: 0;
            padding: 10px;
        }

        h1 {
            text-align: center;
            color: #3a2301;
            font-size: 40px;
            margin-top: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            max-width: 100%;
            box-sizing: border-box;
            min-height: 550px;
        }

        .grid-item {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #e99e9d;
            border-radius: 12px;
            text-align: center;
            color: #3a2301;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; 
            overflow: hidden;
            padding: 15px;
        }

        .grid-item h3 { margin-top: 0; color: #3a2301; }
        .grid-item p { font-size: 13px; line-height: 1.4; color: #3a2301; }

        .btn-option {
            background-color: white;
            border: 1px solid #e99e9d;
            border-radius: 8px;
            padding: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 70px;
            height: 30px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #e99e9d;
        }

        .btn-check {
            margin-top: 10px;
            background-color: #e99e9d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #resultMsg, #resultMsg2 { font-size: 11px; margin-top: 5px; min-height: 15px; }
        #videoStream, #camera-overlay, #photo-preview {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 關鍵：全部統一使用 fill，確保比例與格子容器 100% 綁定 */
    object-fit: fill; 
}
    </style>
</head>
<body>

    <h1>製作七夕粿！</h1>  

    <div class="grid-container">
        
        <!-- 第一關 -->
        <div class="grid-item" id="stage1" style="padding:0;">
            <div id="quiz-content" style="padding:15px;">
                <h3>第一關-福氣到！</h3>
                <p>找找畫面中一共有幾個『福』字？</p>
                <input type="number" id="quizInput" placeholder="數字">
                <button class="btn-check" onclick="checkAnswer()">送出答案</button>
                <p id="resultMsg"></p>
            </div>
            <div id="success-content" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                <img src="webA工作區域 1.png" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>

        <!-- 第二關 -->
        <div class="grid-item" id="stage2" style="padding:0;">
            <div id="quiz2-content" style="padding:15px;">
                <h3>第二關-功名到！</h3>
                <p>請選出代表功名順利的圖案</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;">
                    <button class="btn-option" onclick="checkAnswer2(false)">💰</button>
                    <button class="btn-option" onclick="checkAnswer2(true)">🎓</button>
                    <button class="btn-option" onclick="checkAnswer2(false)">🍎</button>
                    <button class="btn-option" onclick="checkAnswer2(false)">❤️</button>
                </div>
                <p id="resultMsg2"></p>
            </div>
            <div id="success-content2" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                <img src="webB工作區域 1.png" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>

        <!-- 第三關 -->
        <div class="grid-item" id="stage3" style="position: relative; padding: 0; overflow: hidden;">
            <div id="quiz3-content" style="z-index: 4; position: relative;">
                <h3>第三關-緣分</h3>
                <p>開啟鏡頭拍下你的成果！</p>
                <button class="btn-check" onclick="startCamera()">📷 開啟鏡頭</button>
            </div>
            <video id="videoStream" autoplay playsinline muted style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"></video>
            <img id="camera-overlay" src="webC工作區域 1.png" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 2;">
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="photo-preview" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 3;">
        </div>

        <!-- 第四關 -->
        <div class="grid-item">
            <h3>第四關</h3>
            <p>淋上糖水，大功告成！</p>
        </div>

    </div>

    <script>
    // 第一關
    function checkAnswer() {
        const userAnswer = document.getElementById('quizInput').value;
        if (userAnswer === "3") {
            document.getElementById('success-content').style.display = "block";
        } else {
            document.getElementById('resultMsg').innerText = "❌ 再數一次喔！";
            document.getElementById('resultMsg').style.color = "#8b0000";
        }
    }

    // 第二關
    function checkAnswer2(isCorrect) {
        if (isCorrect) {
            document.getElementById('success-content2').style.display = "block";
        } else {
            document.getElementById('resultMsg2').innerText = "❌ 再猜猜看！";
            document.getElementById('resultMsg2').style.color = "#8b0000";
        }
    }

    // 第三關啟動相機
    async function startCamera() {
        const video = document.getElementById('videoStream');
        const overlay = document.getElementById('camera-overlay');
        const quizContent = document.getElementById('quiz3-content');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.style.display = "block";
            overlay.style.display = "block";
            quizContent.style.background = "rgba(255,255,255,0.5)";
            quizContent.innerHTML = "<p style='margin:0;'>📷 點擊畫面定格拍照</p>";
            video.onclick = () => takePicture(stream);
        } catch (err) {
            alert("請確保使用 HTTPS 並開啟相機權限。");
        }
    }

    // 第三關拍照合併
    function takePicture(stream) {
    const video = document.getElementById('videoStream');
    const overlay = document.getElementById('camera-overlay');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo-preview');
    const quizContent = document.getElementById('quiz3-content');

    // 1. 取得格子的實際顯示尺寸 (這能保證與螢幕視覺比例一致)
    const rect = video.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    const ctx = canvas.getContext('2d');

    // 2. 繪製相機畫面：強制填滿畫布
    // 使用 fill 邏輯，直接將影片來源對應到畫布的寬高
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // 3. 繪製疊加素材：同樣強制填滿畫布
    // 因為 CSS 設定了 object-fit: fill，這裡直接畫上去位置就會 100% 吻合
    ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

    // 4. 輸出最終合併照片
    photo.src = canvas.toDataURL('image/png');
    photo.style.display = "block";
    
    // 隱藏預覽元件
    video.style.display = "none";
    overlay.style.display = "none";
    quizContent.style.display = "none";

    // 5. 停止相機
    stream.getTracks().forEach(track => track.stop());
}
    </script>
</body>
</html>
