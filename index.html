<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>製作七夕粿！</title>
    <style>
        body {
            background-image: url('未命名設計.gif'); 
            background-size: 100% auto;
            background-attachment: scroll;
            background-position: center top;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-color: #b22020;
            margin: 0;
            padding: 10px;
        }

        h1 {
            text-align: center;
            color: #3a2301;
            font-size: 40px;
            margin-top: 20px;
        }

        /* 田字型容器 - 必須保留此 class 才能並排 */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            max-width: 100%;
            box-sizing: border-box;
            min-height: 500px; /* 增加最小高度確保美觀 */
        }

        .grid-item {
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #e99e9d;
            border-radius: 12px;
            text-align: center;
            color: #3a2301;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; /* 為了讓圖片絕對定位覆蓋 */
            overflow: hidden;
            padding: 15px; /* 預設內距 */
        }

        /* 針對第一關特殊處理，移除內距讓圖片滿版 */
        #stage1 {
            padding: 0; 
        }

        .grid-item h3 { margin-top: 0; color: #3a2301; }
        .grid-item p { font-size: 14px; line-height: 1.4; color: #3a2301; }

        input[type="number"] {
            width: 80px;
            height: 35px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #e99e9d;
            margin-top: 5px;
        }

        .btn-check {
            margin-top: 10px;
            background-color: #e99e9d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #resultMsg { font-size: 12px; margin-top: 5px; min-height: 18px; }
    </style>
</head>
<body>

    <h1>製作七夕粿！</h1>  

    <!-- 修正：必須使用 grid-container 包裹四個 grid-item -->
    <div class="grid-container">
        
        <!-- 第一關 -->
        <div class="grid-item" id="stage1">
            <!-- 題目內容 -->
            <div id="quiz-content" style="padding: 15px;">
                <h3>第一關-福氣到！</h3>
                <p>找找畫面中一共有幾個『福』字？</p>
                <input type="number" id="quizInput" placeholder="數字">
                <button class="btn-check" onclick="checkAnswer()">送出答案</button>
                <p id="resultMsg"></p>
            </div>
            <!-- 答對後顯示的圖片 (預設隱藏) -->
            <div id="success-content" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                <img src="webA工作區域 1.png" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>

        <!-- 第二關 -->
        <div class="grid-item" id="stage2">
    <div id="quiz2-content">
        <h3>第二關-功名到！</h3>
        <p>請選出代表功名順利的圖案</p>
        
        <!-- 選項按鈕區 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
            <button class="btn-option" onclick="checkAnswer2(false)">💰</button> <!-- 錯誤 -->
            <button class="btn-option" onclick="checkAnswer2(true)">🎓</button>  <!-- 正確答案 -->
            <button class="btn-option" onclick="checkAnswer2(false)">🍎</button> <!-- 錯誤 -->
            <button class="btn-option" onclick="checkAnswer2(false)">❤️</button> <!-- 錯誤 -->
        </div>
        
        <p id="resultMsg2" style="margin-top: 10px; font-weight: bold; min-height: 20px;"></p>
    </div>

    <!-- 答對後的覆蓋照片 -->
    <div id="success-content2" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        <img src="webB工作區域 1.png" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
</div>

    <!-- 答對後顯示的圖片 (預設隱藏) -->
    <div id="success-content2" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        <img src="webB工作區域 1.png" style="width: 100%; height: 100%; object-fit: cover;">
    </div>

        <!-- 第三關 -->
        <div class="grid-item" id="stage3" style="position: relative; padding: 0; overflow: hidden;">
    <!-- 題目區域 -->
    <div id="quiz3-content" style="padding: 15px; display: flex; flex-direction: column; align-items: center;">
        <h3>第三關-成果照</h3>
        <p>拍下你的七夕粿成果！</p>
        
        <!-- 自訂漂亮拍照按鈕 -->
        <label for="cameraInput" class="btn-check" style="display: inline-block; cursor: pointer;">
            📷 開啟相機
        </label>
        <!-- 隱藏原始 input，capture="camera" 會直接開啟相機 -->
        <input type="file" id="cameraInput" accept="image/*" capture="camera" style="display: none;">
        
        <p id="resultMsg3" style="font-size: 12px; margin-top: 10px; color: #3a2301;">尚未拍照</p>
    </div>

    <!-- 拍照後要顯示的照片預覽 (覆蓋全格) -->
    <div id="success-content3" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        <img id="photo-preview" src="" style="width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.5); color: white; font-size: 12px; padding: 5px 0;">🎉 成果上傳成功！</div>
    </div>
        </div>

        <!-- 第四關 -->
        <div class="grid-item">
            <h3>第四關</h3>
            <p>淋上糖水</p>
        </div>

    </div>

    <script>
    function checkAnswer() {
        const userAnswer = document.getElementById('quizInput').value;
        const resultMsg = document.getElementById('resultMsg');
        const quizContent = document.getElementById('quiz-content'); // 修正：新增此行來控制隱藏
        const successContent = document.getElementById('success-content');
        
        const correctAnswer = "3"; 

        if (userAnswer === "") {
            resultMsg.innerText = "請先輸入數字喔！";
            resultMsg.style.color = "yellow";
        } else if (userAnswer === correctAnswer) {
            // 答對時：隱藏文字，顯示圖片
            successContent.style.display = "block";
        } else {
            resultMsg.innerText = "❌ 再數一次喔！";
            resultMsg.style.color = "#8b0000";
        }
    }
        function checkAnswer2(isCorrect) {
    const quizContent2 = document.getElementById('quiz2-content');
    const successContent2 = document.getElementById('success-content2');
    const resultMsg2 = document.getElementById('resultMsg2');

    if (isCorrect) {
        // 答對時：隱藏題目，顯示圖片
        successContent2.style.display = "block";
    } else {
        // 答錯時：顯示錯誤訊息
        resultMsg2.innerText = "❌ 不對喔，再試一次！";
        resultMsg2.style.color = "#8b0000"; // 深紅色
        }
    }   
        // 取得第三關相關元素
const cameraInput = document.getElementById('cameraInput');
const photoPreview = document.getElementById('photo-preview');
const quizContent3 = document.getElementById('quiz3-content');
const successContent3 = document.getElementById('success-content3');

cameraInput.addEventListener('change', function() {
    const file = this.files[0]; // 取得拍攝的照片檔案
    if (file) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            // 1. 將讀取到的照片顯示在預覽圖中
            photoPreview.src = e.target.result;
            
            // 2. 隱藏題目，顯示覆蓋照片
            quizContent3.style.display = "none";
            successContent3.style.display = "block";
        }
        
        reader.readAsDataURL(file); // 讀取圖片路徑
    }
});
    </script>

</body>
</html>

</body>
</html>
